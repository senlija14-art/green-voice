
name: Ador Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android Project
        run: |
          flutter create --platforms=android --org com.ador.live app

      - name: Copy Ador Source Code
        run: |
          cp pubspec.yaml app/pubspec.yaml
          rm -rf app/lib
          cp -r lib app/lib

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Ador APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload Ador APK
        uses: actions/upload-artifact@v4
        with:
          name: Ador-Android
          path: app/build/app/outputs/flutter-apk/app-release.apk
