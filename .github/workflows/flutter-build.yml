
name: Ador Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Ador Source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Build Project
        run: |
          flutter create \
            --platforms=android \
            --org com.ador.live \
            build_app

      - name: Copy Ador App Code
        run: |
          mkdir -p build_app/lib
          cp -r lib/. build_app/lib/

      - name: Install Dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build Ador APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload Ador APK
        uses: actions/upload-artifact@v4
        with:
          name: Ador-Android
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
